env:
  name: metaworld_button
  kwargs:
    task_name: "button-press-v3"
    render_mode: null
    fixed_seed: 42

wrappers:
  sparse_reward:
    enabled: true
    type: "basic"
    kwargs:
      success_reward: 10.0
      failure_reward: 0.0
      dense_scale: 0
    # type: "goal_threshold"
    # kwargs:
    #   success_reward: 50.0
    #   threshold_rewards:
    #     - [0.12, 0.05]
    #     - [0.07, 0.1]
    #     - [0.03, 0.5]
    #   failure_reward: 0.0
    #   use_dense_fallback: true
    #   dense_coef: 0.005 #0.005
    
  exploration:
    enabled: true
    method: logging_only
    kwargs: {}
  # exploration:
  #   enabled: true
  #   method: icm
  #   kwargs:
  #     reward_scale: 0.001
  #     icm_lr: 0.0003
  #     beta: 0.5
  #     update_freq: 1000
  #     feature_dim: 64
  #     hidden_dim: 128
  #     device: "cpu"
  #     clip_intrinsic: 5.0
  # exploration:
  #   enabled: true
  #   method: rnd
  #   kwargs:
  #     reward_scale: 0.001
  #     rnd_lr: 0.0005
  #     update_freq: 1000
  #     feature_dim: 32
  #     hidden_dim: 64
  #     device: "cpu"

agent:
  name: ppo
  kwargs:
    policy: "MlpPolicy"
    learning_rate: 0.0001
    gamma: 0.99
    ent_coef: 0.01
    verbose: 0
    device: "cpu"
    tensorboard_log: "./wandb/logs"

train:
  total_timesteps: 5000000

output:
  save_path: "checkpoints/none_metaworld_button_sparse_icm_basic"
  # save_path: "checkpoints/ppo_metaworld_button_sparse_icm_basic"
  # save_path: "checkpoints/ppo_metaworld_button_sparse_rnd_basic"
  best_save_path: "checkpoints/none_metaworld_button_sparse_icm_basic_best"
  # best_save_path: "checkpoints/ppo_metaworld_button_sparse_icm_basic_best"
  # best_save_path: "checkpoints/ppo_metaworld_button_sparse_rnd_basic_best"

eval:
  num_episodes: 100
  max_steps: 500
  model_path: "checkpoints/none_metaworld_button_sparse_icm_basic_best.zip"
  # model_path: "checkpoints/ppo_metaworld_button_sparse_icm_basic_best.zip"
  # model_path: "checkpoints/ppo_metaworld_button_sparse_rnd_basic_best.zip"

wandb:
  enabled: true
  project: "rl-exploration-benchmark"
  name: "ppo-button-press"
  tags: ["metaworld_button", "sparse", "none", "basic", "final"]