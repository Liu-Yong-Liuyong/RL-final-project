env:
  name: cartpole
  kwargs: {}

wrappers:
  sparse_reward:
    enabled: false   # CartPole already uses sparse reward natively in SparseCartPoleEnv
    kwargs: {}

  # ---------------------------------------------------------------
  # Exploration variants — uncomment ONE block at a time.
  # Match the active block to the save_path / model_path below.
  # ---------------------------------------------------------------

  # [1] Vanilla PPO — no exploration bonus, minimal entropy
  #exploration:
    #enabled: false
    #method: null
    #kwargs: {}

  # [2] PPO + Entropy Regularization — no intrinsic wrapper,
  #     but high ent_coef in agent kwargs drives stochastic exploration
  #exploration:
    #enabled: false
    #method: null
    #kwargs: {}

  # [3] PPO + Count-based intrinsic reward
  #exploration:
    #enabled: true
    #method: intrinsic_count
    #kwargs:
      #bonus_coef: 0.05

  # [4] PPO + ICM (Intrinsic Curiosity Module)
  exploration:
    enabled: true
    method: icm
    kwargs:
      reward_scale: 0.001
      icm_lr: 0.0003
      beta: 0.2
      update_freq: 1000
      feature_dim: 64
      hidden_dim: 128
      device: "cpu"
      clip_intrinsic: 5.0

  # [5] PPO + RND (Random Network Distillation)
  #exploration:
    #enabled: true
    #method: rnd
    #kwargs:
      #reward_scale: 0.001
      #rnd_lr: 0.001
      #update_freq: 1000
      #feature_dim: 64
      #hidden_dim: 128
      #device: "cpu"

# ---------------------------------------------------------------
# Agent kwargs — change ent_coef to switch between:
#   Vanilla PPO           → ent_coef: 0.0
#   Entropy Regularization → ent_coef: 0.1
#   ICM / RND             → ent_coef: 0.01
# ---------------------------------------------------------------
agent:
  name: ppo
  kwargs:
    policy: "MlpPolicy"
    learning_rate: 0.0003
    gamma: 0.99
    ent_coef: 0.01
    verbose: 1

train:
  total_timesteps: 200000

output:
  #save_path: "checkpoints/ppo_cartpole_sparse"           # [1] Vanilla PPO
  #save_path: "checkpoints/ppo_cartpole_sparse_entropy"   # [2] Entropy Reg
  #save_path: "checkpoints/ppo_cartpole_sparse_count"     # [3] Count
  save_path: "checkpoints/ppo_cartpole_sparse_icm"        # [4] ICM
  #save_path: "checkpoints/ppo_cartpole_sparse_rnd"       # [5] RND

eval:
  num_episodes: 20
  max_steps: 500
  #model_path: "checkpoints/ppo_cartpole_sparse.zip"
  #model_path: "checkpoints/ppo_cartpole_sparse_entropy.zip"
  #model_path: "checkpoints/ppo_cartpole_sparse_count.zip"
  model_path: "checkpoints/ppo_cartpole_sparse_icm.zip"
  #model_path: "checkpoints/ppo_cartpole_sparse_rnd.zip"
