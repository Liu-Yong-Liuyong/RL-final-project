env:
  name: gridworld
  kwargs:
    width: 50
    height: 50
    start_pos: [0,0]
    goal_pos: [49,49]
    num_obstacles: 100
    random_seed: 42
    max_steps: 4000

seed: 42

wrappers:
  sparse_reward:
    enabled: false
    kwargs: {}
  exploration:
    enabled: true
    method: logging_only
    kwargs: {}
  # exploration:
  #   enabled: true
  #   method: icm
  #   kwargs:
  #     reward_scale: 0.00001
  #     icm_lr: 0.0005
  #     beta: 0.2
  #     update_freq: 4096
  #     feature_dim: 32
  #     hidden_dim: 64
  #     device: "cpu"
  #     clip_intrinsic: 0.1
  # exploration:
  #   enabled: true
  #   method: rnd
  #   kwargs:
  #     reward_scale: 0.001
  #     rnd_lr: 0.0005
  #     update_freq: 4096
  #     feature_dim: 32
  #     hidden_dim: 64
  #     device: "cpu"

agent:
  name: ppo
  kwargs:
    policy: "MlpPolicy"
    learning_rate: 0.0001
    gamma: 0.9995
    ent_coef: 0.3
    verbose: 0

train:
  total_timesteps: 5000000

output:
  # save_path: "checkpoints/ppo_gridworld_easy"
  save_path: "checkpoints/ppo_gridworld_easy_50x50_obstacles_none"  
  # save_path: "checkpoints/ppo_gridworld_easy_count_intrinsic"
  # save_path: "checkpoints/ppo_gridworld_easy_icm"
  # save_path: "checkpoints/ppo_gridworld_easy_rnd"

  best_save_path: "checkpoints/ppo_gridworld_easy_50x50_obstacles_none_best"
  # best_save_path: "checkpoints/ppo_gridworld_easy_icm_best"
  # best_save_path: "checkpoints/ppo_gridworld_easy_rnd_best"

eval:
  num_episodes: 5
  max_steps: 3000
  model_path: "checkpoints/ppo_gridworld_easy_50x50_obstacles_none_best.zip"
  # model_path: "checkpoints/ppo_gridworld_easy_icm_best.zip"
  # model_path: "checkpoints/ppo_gridworld_easy_rnd_best.zip"

wandb:
  enabled: true
  project: "rl-exploration-benchmark"
  name: "ppo-gridworld"
  tags: ["gridworld", "none", "50*50", "obstacles"]