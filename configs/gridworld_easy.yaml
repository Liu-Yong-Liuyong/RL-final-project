agent:
  name: ppo
  kwargs:
    policy: "MlpPolicy"
    learning_rate: 0.0001
    gamma: 0.99
    ent_coef: 0.1
    verbose: 1

train:
  total_timesteps: 500000

output:
  # save_path: "checkpoints/ppo_gridworld_easy"
  save_path: "checkpoints/ppo_gridworld_easy_entcoef"
  # save_path: "checkpoints/ppo_gridworld_easy_count_intrinsic"
