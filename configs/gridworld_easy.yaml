env:
  name: gridworld
  kwargs:
    width: 20
    height: 20
    start_pos: [0,0]
    goal_pos: [19,19]
    num_obstacles: 25
    random_seed: 52
    max_steps: 100

seed: 42

wrappers:
  sparse_reward:
    enabled: false
    kwargs: {}

  # exploration:
