env:
  name: metaworld_pick_place
  kwargs:
    task_name: "pick-place-v3"
    render_mode: null

wrappers:
  sparse_reward:
    enabled: true
    type: "pick_place_milestone"
    kwargs:
      success_reward: 50.0
      reach_threshold_rewards:
        - [0.2, 0.05]
        - [0.1, 0.10]
        - [0.05, 0.20]
        - [0.02, 0.25]
      grasp_reward: 0.8
      lift_reward: 1.5
      #near_target_reward: 2.0
      #target_threshold: 0.10
      target_threshold_rewards:
        - [0.20, 0.8]
        - [0.10, 2.0]
        - [0.05, 5.0]
      lift_height: 0.01
      failure_reward: 0.0
      use_dense_fallback: true
      dense_coef: 0.01

  #exploration:
    #enabled: false
    #method: null
    #kwargs: {}
  #exploration:
    #enabled: true
    #method: intrinsic_count
    #kwargs:
      #bonus_coef: 0.05
  exploration:
    enabled: true
    method: icm
    kwargs:
      reward_scale: 0.001
      icm_lr: 0.0003
      beta: 0.2
      update_freq: 2000
      feature_dim: 64
      hidden_dim: 128
      device: "cpu"
      clip_intrinsic: 1.0
  #exploration:
    #enabled: true
    #method: rnd
    #kwargs:
      #reward_scale: 0.00005
      #rnd_lr: 0.0003
      #update_freq: 2000
      #feature_dim: 64
      #hidden_dim: 128
      #device: "cpu"

agent:
  name: ppo
  kwargs:
    policy: "MlpPolicy"
    learning_rate: 0.0001 #0.0002
    gamma: 0.99
    ent_coef: 0.01
    verbose: 1

train:
  total_timesteps: 600000

output: 
  #save_path: "checkpoints/ppo_metaworld_pick_sparse"
  #best_save_path: "checkpoints/ppo_metaworld_pick_sparse_best"
  save_path: "checkpoints/ppo_metaworld_pick_sparse_icm"
  best_save_path: "checkpoints/ppo_metaworld_pick_sparse_icm_best"



eval:
  num_episodes: 100
  max_steps: 500
  #model_path: "checkpoints/ppo_metaworld_pick_sparse_best.zip"
  model_path: "checkpoints/ppo_metaworld_pick_sparse_icm_best.zip"


wandb:
  enabled: true
  project: "rl-exploration-pick-benchmark"
  name: "ppo-icm-pick-v3"
  tags: ["metaworld_pick_place-v3", "sparse", "icm"]